name: "Setup environment"
description: "Install node, go, pnpm & setup turbo cache (needs actions/checkout)"

runs:
  using: "composite"
  steps:
    - name: 🦆 Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: 🛠️ Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: "mise.toml"
        cache: "pnpm"

    - name: 🧰 Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "services/archiv/go.mod"
        cache: true
        cache-dependency-path: "services/archiv/go.sum"

    - name: 📦 Install deps
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🏎️ Configure turbo
      shell: bash
      run: |
        pnpm turbo telemetry disable

    - name: 🗂️ Setup turbo cache
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
