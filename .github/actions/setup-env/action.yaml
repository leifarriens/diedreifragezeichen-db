name: "Setup environment"
description: "Install node, go, pnpm & setup turbo cache (needs actions/checkout)"

runs:
  using: "composite"
  steps:
    - name: 🦆 Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: 🛠️ Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: "mise.toml"
        cache: "pnpm"

    - name: 🧰 Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: "services/archiv/go.mod"
        cache: true
        cache-dependency-path: "services/archiv/go.sum"

    - name: 📦 Install deps
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: 🏎️ Configure turbo
      shell: bash
      run: |
        pnpm turbo telemetry disable

    - name: 🗂️ Setup turbo cache
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
