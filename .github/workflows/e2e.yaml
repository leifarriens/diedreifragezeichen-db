name: E2E Tests

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout trusted repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Do not execute code from fork deployments with repository secrets.
      - name: Verify deployment commit belongs to a repository branch
        shell: bash
        env:
          DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          [[ "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$DEPLOYMENT_SHA^{commit}"
          [[ -n "$(git for-each-ref --contains="$DEPLOYMENT_SHA" --format='%(refname)' refs/remotes/origin/)" ]]

      - name: 📂 Checkout deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          persist-credentials: false

      - name: 🛠️ Setup environment
        uses: ./.github/actions/setup-env

      - name: Test deployed API
        run: pnpm --filter @ddfdb/website test:e2e --project=api
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/website/playwright-report/
          retention-days: 30
