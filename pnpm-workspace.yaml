packages:
  - "apps/*"
  - "configs/**"
  - "packages/*"
  - "services/*"
  - "!**/test/**"

overrides:
  lightningcss: 1.30.1

catalog:
  "@vitest/coverage-v8": ^5.0.1
  eslint: ^10.10.0
  typescript: ^6.0.2
  vitest: ^5.0.1

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: false
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
minimumReleaseAgeExclude:
  - turbo@2.11.4
  - "@turbo/*"
  - "@expo/*"
  - "@react-native/*"
  - babel-preset-expo@58.0.9
  - expo-*
  - expo
  - hermes-compiler@260318099.0.4
  - react-native@0.88.0-rc.3
trustPolicyExclude:
  - "semver@6.3.1" # https://github.com/npm/node-semver/issues/838
