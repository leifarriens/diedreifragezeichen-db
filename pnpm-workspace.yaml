packages:
  - "apps/*"
  - "configs/**"
  - "packages/*"
  - "services/*"
  - "!**/test/**"

overrides:
  lightningcss: 1.30.1

catalog:
  "@vitest/coverage-v8": ^5.0.5
  eslint: ^10.13.0
  tailwindcss: "4.1.12"
  typescript: ^6.0.2
  vitest: ^5.0.5

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: false
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@turbo/*"
  - "@expo/*"
  - "@react-native/*"
  - babel-preset-expo@58.0.20 || 58.0.21
  - expo-*
  - expo
  - "@noxcturnal/noxcturnal-*"
  - noxcturnal@0.1.8 || 0.1.10
trustPolicyExclude:
  - "semver@6.3.1" # https://github.com/npm/node-semver/issues/838
