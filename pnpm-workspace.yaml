packages:
  - "apps/*"
  - "configs/**"
  - "packages/*"
  - "services/*"
  - "!**/test/**"

overrides:
  lightningcss: 1.30.1

catalog:
  "@vitest/coverage-v8": ^5.0.5
  eslint: ^10.12.0
  tailwindcss: "4.1.12"
  typescript: ^6.0.2
  vitest: ^5.0.5

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: false
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - turbo@2.11.4
  - "@turbo/*"
  - "@expo/*"
  - "@react-native/*"
  - babel-preset-expo@58.0.9 || 58.0.11 || 58.0.17
  - expo-*
  - expo
  - hermes-compiler@260318099.0.4
  - react-native@0.88.0-rc.3 || 0.88.0
  - 2g@1.0.1
  - react-native-drawer-layout@4.2.12
  - react-native-screens@4.30.0
  - react-native-svg@15.16.0
trustPolicyExclude:
  - "semver@6.3.1" # https://github.com/npm/node-semver/issues/838
